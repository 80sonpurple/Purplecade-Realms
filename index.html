
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purplecade Realms</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background-color: purple;
    color: #CCCCFF;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* =========================
   HOME PAGE
========================= */

#homePage {
    display: block;
    min-height: 100dvh;
}

header {
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

.section {
    margin: 30px auto;
    max-width: 800px;
    padding: 0 15px;
}

button {
    background-color: #B8860B;
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 8px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 16px;
}

button:hover {
    opacity: 0.9;
}

/* =========================
   FULL-SCREEN EMBED PAGE
========================= */

#embedPage {
    display: none;

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    background-color: black;

    z-index: 999;

    flex-direction: column;
}

/* =========================
   EMBED
========================= */

#contentFrame {
    display: block;

    width: 100%;
    height: calc(100dvh - 55px);

    flex: 1;

    border: none;
    background-color: black;
}

/* =========================
   CONTROL BAR
========================= */

.embedControls {
    width: 100%;
    height: 55px;
    min-height: 55px;

    background-color: #222;

    display: flex;
    align-items: center;

    padding: 5px 10px;
}

.backButton {
    width: auto;

    margin: 0;

    padding: 9px 18px;

    border-radius: 8px;

    background-color: #B8860B;
    color: white;

    font-size: 16px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #contentFrame {
        height: calc(100dvh - 50px);
    }

    .embedControls {
        height: 50px;
        min-height: 50px;
    }

    .backButton {
        padding: 8px 14px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME PAGE
========================= -->

<div id="homePage">

    <header>
        <h1>Purplecade Realms</h1>
    </header>

    <div class="section">

        <h2>= Game Selection =</h2>

        <button onclick="loadEmbed('https://play.fancade.com/6A149E505868B2E4')">
            Play Purplecade Realms
        </button>

    </div>


    <div class="section">

        <h2>= Extras =</h2>

        <button onclick="loadEmbed('https://docs.google.com/document/d/1KL9O8d-mnIpBcd5P-zjp_yJadDqOqgFkPvq2eLGYpGg/edit?usp=drivesdk')">
            Purplecade Realms: Official Manual
        </button>

        <button onclick="loadEmbed('https://play.fancade.com/6A602320A25772AC')">
            Purplecade Realms: Model Kit
        </button>

    </div>

</div>


<!-- =========================
     EMBED PAGE
========================= -->

<div id="embedPage">

    <iframe
        id="contentFrame"
        allowfullscreen>
    </iframe>

    <div class="embedControls">

        <button
            class="backButton"
            onclick="goHome()">
            ← Back to Home Page
        </button>

    </div>

</div>


<script>

function loadEmbed(url) {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("embedPage").style.display = "flex";

    document.getElementById("contentFrame").src = url;
}


function goHome() {

    document.getElementById("contentFrame").src = "";

    document.getElementById("embedPage").style.display = "none";

    document.getElementById("homePage").style.display = "block";
}

</script>

</body>
</html>
